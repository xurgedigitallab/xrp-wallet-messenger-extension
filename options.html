<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Extension Settings</title>
  <style>
    body {
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      padding: 40px 20px;
      max-width: 500px;
      margin: auto;
      color: #333;
    }

    .container {
      background-color: #fff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .header {
      display: flex;
      align-items: center;
      margin-bottom: 25px;
    }

    .header-icon {
      font-size: 26px;
      margin-right: 10px;
    }

    h1 {
      font-size: 22px;
      margin: 0;
    }

    label {
      font-weight: 600;
      margin-bottom: 10px;
      display: block;
    }

    select {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px 16px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    #save-button {
      background-color: #0077db;
      color: white;
    }

    #save-button:hover {
      background-color: #005bb5;
    }

    #feedbackButton {
      background-color: #f0f0f0;
      color: #333;
      border: 1px solid #ccc;
    }

    #feedbackButton:hover {
      background-color: #e0e0e0;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .modal-content {
      position: relative;
      background: linear-gradient(145deg, #ffffff, #f8f9fa);
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      border: 1px solid #e0e0e0;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
      color: #222;
    }

    .close-button {
      position: absolute;
      top: 15px;
      right: 15px;
      background-color: #f0f0f0;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .close-button:hover {
      background-color: #e0e0e0;
      color: #333;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      font-size: 15px;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      border: 1px solid #ddd;
      border-radius: 10px;
      resize: none;
      margin: 0 auto 20px;
      background-color: #f9f9fb;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
      transition: border-color 0.2s ease;
    }

    textarea:focus {
      border-color: #0077db;
      outline: none;
      box-shadow: 0 0 0 3px rgba(0, 119, 219, 0.1);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
    }

    #submitFeedback {
      background: linear-gradient(90deg, #0077db, #005bb5);
      color: white;
      font-weight: 600;
    }

    #submitFeedback:hover {
      background: linear-gradient(90deg, #005bb5, #003f87);
    }

    #cancelFeedback {
      background-color: #f5f5f5;
      color: #555;
      border: 1px solid #ddd;
      font-weight: 500;
    }

    #cancelFeedback:hover {
      background-color: #e5e5e5;
      border-color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon">⚙️</div>
      <h1>Button Theme Settings</h1>
    </div>
    
    <label for="color-select">Select Button Theme:</label>
    <select id="color-select">
      data-text="#ffffff" data-hover="#005bb5" data-border="" data-border-radius="8px" data-font-size="16px" data-font-style="normal"
      <option value="#0077db" data-text="#ffffff" data-hover="#005bb5" data-border="" data-border-radius="8px" data-font-size="14px" data-font-style="normal" data-text-transform="none" data-text-decoration="none">Blue</option>
      <option value="#28a745" data-text="#ffffff" data-hover="#1e7e34" data-border="" data-border-radius="8px" data-font-size="14px" data-font-style="normal" data-text-transform="none" data-text-decoration="none">Green</option>
      <option value="#dc3545" data-text="#ffffff" data-hover="#bd2130" data-border="" data-border-radius="8px" data-font-size="16px" data-font-style="normal" data-text-transform="none" data-text-decoration="none">Red</option>
      <option value="#343a40" data-text="#ffffff" data-hover="#23272b" data-border="" data-border-radius="8px" data-font-size="14px" data-font-style="normal" data-text-transform="none" data-text-decoration="none">Dark Gray</option>
      <option value="#f8f9fa" data-text="#212529" data-hover="#e2e6ea" data-border="" data-border-radius="8px" data-font-size="14px" data-font-style="normal" data-text-transform="none" data-text-decoration="none">Light Gray</option>
    </select>

    <div class="button-group">
      <button id="save-button">Save</button>
      <button id="feedbackButton">Provide Feedback</button>
    </div>
  </div>

  <!-- Feedback Modal -->
  <div id="feedbackModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Provide Feedback</h2>
        <button id="closeModal" class="close-button">×</button>
      </div>
      <textarea id="feedbackText" placeholder="Enter your feedback here..." required></textarea>
      <div class="modal-actions">
        <button id="submitFeedback">Submit</button>
        <button id="cancelFeedback">Cancel</button>
      </div>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
