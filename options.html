<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Extension Settings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }
    select {
      width: 100%;
      padding: 8px;
      margin-bottom: 20px;
      font-size: 16px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #0077db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005bb5;
    }
  </style>
</head>
<body>
  <h1>Button Theme Settings</h1>
  <label for="color-select">Select Button Theme:</label>
  <select id="color-select">
    <option value="#0077db" data-text="#ffffff" data-hover="#005bb5">Blue</option>
    <option value="#28a745" data-text="#ffffff" data-hover="#1e7e34">Green</option>
    <option value="#dc3545" data-text="#ffffff" data-hover="#bd2130">Red</option>
    <option value="#343a40" data-text="#ffffff" data-hover="#23272b">Dark Gray</option>
    <option value="#f8f9fa" data-text="#212529" data-hover="#e2e6ea">Light Gray</option>
  </select>
  <button id="save-button">Save</button>
  <script src="options.js"></script>
</body>
</html>
